changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: >-
  *
  {{- if .Custom.Issue}}
  [{{.Custom.Issue}}](https://github.com/StanislavKraev/tbot-menu/issues/{{.Custom.Issue}})
  {{- end }}
  {{.Body}}
kinds:
    - label: Added
      auto: minor
    - label: Changed
      auto: major
    - label: Deprecated
      auto: minor
    - label: Removed
      auto: major
    - label: Fixed
      auto: patch
    - label: Security
      auto: patch
    - label: CI
      auto: patch
    - label: Doc
      auto: patch
newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 1
    endOfVersion: 1
envPrefix: CHANGIE_
custom:
- key: Issue
  type: string
  label: Issue number, for ex. issue-1
