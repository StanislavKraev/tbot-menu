#          mkdir -p ~/.ssh
#          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
#          chmod 600 ~/.ssh/id_rsa
#          ssh -o StrictHostKeyChecking=no -L 5000:localhost:5000 \
#            -fN ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT || 22 }}
#          sleep 5
#          curl -s http://localhost:5000/v2/ || echo "Registry not responding yet"

#      - name: Build and push
#        uses: docker/build-push-action@v5
#        with:
#          context: .
#          file: ./Dockerfile
#          push: true
#          tags: |
#            ${{ env.IMAGE_NAME }}:latest
#            ${{ env.IMAGE_NAME }}:${{ github.sha }}
#          cache-from: type=gha
#          cache-to: type=gha,mode=max
#          platforms: linux/amd64

      - name: Copy image to prod
        run: |
          docker buildx build --tag ${{ env.IMAGE_NAME }}:latest --load .
          docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.IMAGE_NAME }}.tar.gz
          target: "~/"

      - name: Load image and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/
            zcat ${{ env.IMAGE_NAME }}.tar.gz | docker load
            rm ${{ env.IMAGE_NAME }}.tar.gz
