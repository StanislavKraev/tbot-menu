services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_MODE: ${BOT_MODE:-webhook}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:8080/webhook}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8080
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      YANDEX_DISK_PDF_URL: ${YANDEX_DISK_PDF_URL}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bot-network

  # Load balancer для webhook режима (опционально)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot-1
    deploy:
      resources:
        limits:
          memory: 64M
    profiles:
      - webhook

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"
    environment:
      DOZZLE_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 128M

  registry:
    image: registry:2-alpine
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  registry_data:

networks:
  bot-network:
    driver: bridge
