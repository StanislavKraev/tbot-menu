  # Load balancer для webhook режима (опционально)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./certs:/etc/letsencrypt
      - ./nginx:/etc/nginx/conf.d
#    depends_on:
#      - bot-1
    deploy:
      resources:
        limits:
          memory: 64M

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"
    environment:
      DOZZLE_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 128M

  registry:
    image: registry:3.0.0
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - bot-network

volumes:
  postgres_data:
    external: true
  registry_data:
    external: true

networks:
  bot-network:
    driver: bridge
