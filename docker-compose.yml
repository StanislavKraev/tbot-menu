services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tbot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  bot:
    image: telegram-bot:latest
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_MODE: ${BOT_MODE:-webhook}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8080
      DB_HOST: postgres
      DATABASE_CONN: ${DATABASE_CONN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      YANDEX_DISK_PDF_URL: ${YANDEX_DISK_PDF_URL}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bot-network

  # Load balancer для webhook режима (опционально)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./certs:/etc/letsencrypt
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - bot
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - bot-network

  dozzle:
    image: amir20/dozzle:v10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_BASE: /dozlog
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - bot-network

volumes:
  postgres_data:
    external: true

networks:
  bot-network:
    driver: bridge
