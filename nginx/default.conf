server {
    listen 80;
    server_name kraevst.fvds.ru;

    # Путь для проверки Certbot
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Перенаправление на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kraevst.fvds.ru;

    ssl_certificate /etc/letsencrypt/fullchain1.pem;
    ssl_certificate_key /etc/letsencrypt/privkey1.pem;

    # Проксирование вебхуков к боту
    location /webhook/ {
        proxy_pass http://localhost:8080; # Бот работает в network_mode: host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /dozlog/ {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
        proxy_pass http://dozzle:8080;

        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }
}
